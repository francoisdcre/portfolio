<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>François Dancre</title>
    <link rel="stylesheet" href="css/styles.css" />
    <link rel="stylesheet" href="css/theme.css" />
    <link
      href=" https://cdn.jsdelivr.net/npm/fullpage.js@4.0.40/dist/fullpage.min.css "
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://cdn.jsdelivr.net/npm/fullpage.js@4.0.40/dist/fullpage.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.1/dist/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.1/dist/SplitText.min.js"></script>
  </head>
  <body>
    <nav
      id="menu"
      class="w-full fixed top-0 left-0 z-10 transition-opacity duration-500 opacity-0"
    >
      <ul class="flex align-center justify-around">
        <li class="hidden lg:block">
          <a href="#home">Home</a>
        </li>
        <li class="hidden lg:block">
          <a href="#about">About</a>
        </li>
        <li class="hidden lg:block">
          <a href="#journey">Journey</a>
        </li>
        <li>
          <h1 class="text-xl lg:text-3xl font-bold">François Dancre</h1>
        </li>
        <li class="hidden lg:block">
          <a href="#skills">Skills</a>
        </li>
        <li class="hidden lg:block">
          <a href="#projects">Projects</a>
        </li>
        <li class="hidden lg:block">
          <a href="#contact">Contact</a>
        </li>
      </ul>
    </nav>
    <div id="fullpage">
      <div class="section relative h-dvh flex items-center justify-center">
        <div
          class="w-fit absolute top-20 xl:top-16 text-center z-10 text-[clamp(1rem,8vw,9rem)]"
        >
          <h1 class="font-bold uppercase text-white/40 whitespace-nowrap split">
            Web Developer
          </h1>
        </div>

        <div class="relative z-10">
          <img src="assets/img/angel.webp" class="w-xl xl:w-2xl" />
        </div>

        <div
          class="absolute left-0 top-0 md:block md:top-1/2 md:-translate-y-1/2"
        >
          <img
            src="assets/img/backgroundLeft.webp"
            class="w-xs lg:w-sm xl:w-md"
          />
        </div>

        <div
          class="absolute right-0 bottom-0 md:block md:top-1/2 md:-translate-y-1/2 z-0"
        >
          <img
            src="assets/img/backgroundRight.webp"
            class="w-xs lg:w-sm xl:w-md"
          />
        </div>

        <a
          href="#about"
          class="absolute bottom-10 left-1/2 -translate-x-1/2 z-0 w-20 z-20"
        >
          <video
            autoplay
            muted
            loop
            class="absolute bottom-10 left-1/2 -translate-x-1/2 z-0 w-10 sm:w-20"
          >
            <source src="assets/video/scrollDown.webm" type="video/mp4" />
          </video>
        </a>
      </div>
      <div
        class="section h-dvh relative flex items-center justify-center"
      ></div>
    </div>
    <script src="js/fullPage.js"></script>
    <script src="js/gsap.js"></script>
  </body>
</html>
